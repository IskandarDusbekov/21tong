<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="21 Tong">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14170f"/>
      <stop offset=".55" stop-color="#2a331c"/>
      <stop offset="1" stop-color="#6a3a1e"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd988"/>
      <stop offset=".5" stop-color="#f5a637"/>
      <stop offset="1" stop-color="#e2592a"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".86" r=".6">
      <stop offset="0" stop-color="#f5a637" stop-opacity=".65"/>
      <stop offset="1" stop-color="#f5a637" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="rnd"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>

  <g clip-path="url(#rnd)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <rect width="512" height="512" fill="url(#glow)"/>

    <!-- Tong nurlari -->
    <g stroke="url(#sun)" stroke-width="13" stroke-linecap="round">
      <line x1="256" y1="300" x2="256" y2="262"/>
      <line x1="210" y1="312" x2="188" y2="279"/>
      <line x1="302" y1="312" x2="324" y2="279"/>
      <line x1="172" y1="340" x2="140" y2="318"/>
      <line x1="340" y1="340" x2="372" y2="318"/>
    </g>

    <!-- Ko'tarilayotgan quyosh -->
    <circle cx="256" cy="398" r="82" fill="url(#sun)"/>

    <!-- 21 -->
    <text x="256" y="232" text-anchor="middle" font-family="'Segoe UI',system-ui,Arial,sans-serif"
          font-size="190" font-weight="800" letter-spacing="-6" fill="#fdf6e8">21</text>

    <!-- Harbiy chevron (saf/pogon) -->
    <path d="M196 470 L256 440 L316 470" fill="none" stroke="#fdf6e8" stroke-width="12"
          stroke-linecap="round" stroke-linejoin="round" opacity=".92"/>
  </g>
</svg>
