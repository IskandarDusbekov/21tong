# 21tong — nginx konfiguratsiyasi
# ------------------------------------------------------------------
# Serverga nusxalanadi: /etc/nginx/sites-available/21tong
#
# ⚠️ Ishlatishdan oldin almashtiring:
#   SIZNING_DOMEN   -> o'z domeningiz (masalan: 21tong.uz)
#   /home/ubuntu    -> loyiha turgan foydalanuvchi uyi (agar boshqa bo'lsa)
#
# Bu HTTP (80-port) config. Avval shu bilan ishga tushiring, keyin
# `sudo certbot --nginx -d SIZNING_DOMEN -d www.SIZNING_DOMEN` ni ishga
# tushiring — u HTTPS (443) blokini va HTTP->HTTPS yo'naltirishni
# AVTOMATIK qo'shadi. Qo'lda SSL yozish shart emas.
# ------------------------------------------------------------------

server {
    listen 80;
    server_name SIZNING_DOMEN www.SIZNING_DOMEN;

    # Video krujok va rasm yuklash uchun (zarur bo'lsa oshiring)
    client_max_body_size 50m;

    # Mini App (React SPA) — shu papkadan beriladi
    root /home/ubuntu/21tong/miniapp/dist;
    index index.html;

    # Django static fayllari (admin paneli, DRF) — `collectstatic` natijasi
    location /static/ {
        alias /home/ubuntu/21tong/backend/staticfiles/;
        access_log off;
        expires 30d;
    }

    # Yuklangan fayllar: video raportlar, rasm chelenji, mukofot/taklif rasmlari
    location /media/ {
        alias /home/ubuntu/21tong/backend/media/;
        access_log off;
        expires 7d;
    }

    # Backend API (bot va Mini App shu orqali ishlaydi)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django admin (texnik boshqaruv)
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Boshqaruv paneli (React SPA, base: /panel/)
    location /panel/ {
        alias /home/ubuntu/21tong/panel/dist/;
        try_files $uri $uri/ /panel/index.html;
    }

    # Mini App (React SPA, base: /) — qolgan barcha yo'llar index.html'ga
    location / {
        try_files $uri $uri/ /index.html;
    }
}
